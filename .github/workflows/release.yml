name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust
        run: rustup default stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: tar -czf wows-monitor-companion-linux-x86_64.tar.gz -C target/release wows-monitor-companion

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: linux-x86_64
          path: wows-monitor-companion-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust
        run: rustup default stable

      - name: Build
        run: cargo build --release --locked

      - name: Rename executable
        shell: pwsh
        run: Copy-Item target/release/wows-monitor-companion.exe wows-monitor-companion-windows-x86_64.exe

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: windows-x86_64
          path: wows-monitor-companion-windows-x86_64.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
