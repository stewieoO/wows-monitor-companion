[package]
name = "wows-monitor-companion"
version = "1.0.0"
edition = "2024"
description = "A small tray app that copies WoWs tempArenaInfo.json files to workaround the chrome system folder issue"

[package.metadata.winres]
ProductName = "WoWs Monitor Companion"
FileDescription = "WoWs Monitor Companion"
OriginalFilename = "wows-monitor-companion.exe"

[dependencies]
auto-launch = "0.6"
directories = "6"
iced = { version = "0.14", features = ["svg", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1"
